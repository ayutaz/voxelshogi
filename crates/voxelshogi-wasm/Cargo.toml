[package]
name = "voxelshogi-wasm"
description = "WebAssembly bindings of the VoxelShogi rule engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
voxelshogi-core = { version = "0.1.0", path = "../voxelshogi-core" }
# Must match the wasm-bindgen-cli version used by scripts/build-wasm.sh exactly.
wasm-bindgen = "=0.2.129"
serde_json = "1"
