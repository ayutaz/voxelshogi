name = "voxelshogi-ml"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "huggingface-hub" },
    { name = "numpy" },
    { name = "onnx" },
    { name = "onnxconverter-common" },
    { name = "onnxruntime" },
    { name = "onnxscript" },
    { name = "psutil" },
    { name = "pyarrow" },
    { name = "safetensors" },
    { name = "torch", version = "2.14.1", source = { registry = "https://pypi.org/simple" }, marker = "sys_platform != 'linux'" },
    { name = "torch", version = "2.14.1+cpu", source = { registry = "https://download.pytorch.org/whl/cpu" }, marker = "sys_platform == 'linux'" },
    { name = "voxelshogi" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "huggingface-hub", specifier = ">=2.3.0" },
    { name = "numpy", specifier = ">=2.5.4" },
    { name = "onnx", specifier = ">=1.23.2" },
    { name = "onnxconverter-common", specifier = ">=1.16.0" },
    { name = "onnxruntime", specifier = ">=1.31.1" },
    { name = "onnxscript", specifier = ">=0.7.2" },
    { name = "psutil", specifier = ">=7.2.2" },
    { name = "pyarrow", specifier = ">=26.0.0" },
    { name = "safetensors", specifier = ">=0.8.0" },
    { name = "torch", marker = "sys_platform != 'linux'", specifier = ">=2.14.1" },
    { name = "torch", marker = "sys_platform == 'linux'", specifier = ">=2.14.1", index = "https://download.pytorch.org/whl/cpu" },
    { name = "voxelshogi", editable = "crates/voxelshogi-python" },
]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=9.1.1" },
    { name = "ruff", specifier = ">=0.17.3" },
]
