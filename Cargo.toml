[workspace]
resolver = "3"
members = ["crates/voxelshogi-core", "crates/voxelshogi-wasm", "crates/voxelshogi-python"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["ayutaz"]
repository = "https://github.com/ayutaz/voxelshogi"
rust-version = "1.85"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2

# Keep debug information: stripped Mach-O dylibs can fail to load on macOS 27.
[profile.python]
inherits = "release"
debug = 1
strip = "none"
