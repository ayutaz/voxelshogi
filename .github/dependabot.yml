version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '01:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    groups:
      rust-compatible:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: '01:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    groups:
      web-compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '01:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    groups:
      actions-compatible:
        update-types: [minor, patch]
