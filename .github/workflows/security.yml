name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 16 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    uses: ./.github/workflows/change-scope.yml

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: scope
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - id: proof
        env:
          SCOPE_JSON: ${{ toJSON(needs.scope) }}
        run: node scripts/ci/security-scope.mjs
      - if: steps.proof.outputs.analyze == 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - if: steps.proof.outputs.analyze == 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}

  scheduled-audit:
    name: Scheduled dependency audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/dependency-audit.yml
    permissions:
      contents: read
