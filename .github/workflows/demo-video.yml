name: Demo video

on:
  workflow_dispatch:
    inputs:
      add_bgm_only:
        description: Add original BGM to the already verified public S video without recapturing
        type: boolean
        default: false
      verify_ui:
        description: Verify arena UI, real models and camera before recording
        type: boolean
        default: false
      verify_public_storage:
        description: Create one owned public test game for subsequent D1 readback and deletion
        type: boolean
        default: false
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  record:
    if: (github.event_name == 'workflow_dispatch' && !inputs.add_bgm_only) || (github.event.label.name == 'record-demo' && github.event.pull_request.head.repo.full_name == github.repository)
    name: Record the real arena and export the fifteen-second demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install the recording tools and Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          pnpm exec playwright install --with-deps chromium
      - run: pnpm wasm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: inputs.verify_ui
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: inputs.verify_ui
        with:
          version: '0.11.23'
          enable-cache: true
      - name: Prepare private verification models without training or publication
        if: inputs.verify_ui
        working-directory: .
        run: |
          uv sync --locked
          uv run --locked python -m export.generate runs/m3/ci
          uv run --locked python scripts/ci/prepare-m6-model.py
          node scripts/prepare-inference.mjs runs/m3/ci apps/web/public/models/m3 --local
      - name: Prepare the pinned installed runtime for the public S shot
        if: ${{ !inputs.verify_ui }}
        working-directory: .
        run: node scripts/prepare-public-runtime.mjs
      - run: pnpm build
      - name: Verify actual model formats and arena integration
        if: inputs.verify_ui
        run: |
          pnpm exec playwright test -c model-playwright.config.ts
          pnpm exec playwright test -c arena-model-playwright.config.ts
        env:
          PW_CHANNEL: ''
      - name: Verify all arena interactions and three screen sizes
        if: inputs.verify_ui
        run: pnpm e2e
        env:
          PW_CHANNEL: ''
          E2E_COMMIT: ${{ github.sha }}
      - name: Save only arena images, never private model traces
        if: always() && inputs.verify_ui
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arena-ui-${{ github.sha }}
          path: |
            apps/web/test-results/launch-*/attachments/*.png
            apps/web/test-results/redesign-*/attachments/*.png
            apps/web/test-results/*/test-failed-*.png
          retention-days: 2
          if-no-files-found: error
      - name: Repeat real search and camera regression
        if: inputs.verify_ui
        run: pnpm e2e ai.spec.ts --grep '2D/3D and camera' --repeat-each=3 --workers=1 --retries=0
        env:
          PW_CHANNEL: ''
          E2E_COMMIT: ${{ github.sha }}
      - name: Capture and validate the real game
        working-directory: .
        run: node scripts/demo-video.mjs "$RUNNER_TEMP/demo-video"
      - name: Verify automatic storage from the actual public browser
        if: inputs.verify_public_storage
        working-directory: .
        run: node scripts/verify-public-arena-storage.mjs "$RUNNER_TEMP/public-storage"
      - name: Save only the owned public game proof for D1 readback
        if: always() && inputs.verify_public_storage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: public-storage-${{ github.sha }}
          path: |
            ${{ runner.temp }}/public-storage/public-storage.json
            ${{ runner.temp }}/public-storage/public-storage-payload.json
            ${{ runner.temp }}/public-storage/public-storage.png
          retention-days: 2
          if-no-files-found: error
      - name: Save only reviewable deliverables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: demo-video-${{ github.sha }}
          path: |
            ${{ runner.temp }}/demo-video/demo-main.mp4
            ${{ runner.temp }}/demo-video/hook-a.mp4
            ${{ runner.temp }}/demo-video/hook-b.mp4
            ${{ runner.temp }}/demo-video/ogp.png
            ${{ runner.temp }}/demo-video/poster.png
            ${{ runner.temp }}/demo-video/contact-sheet.png
            ${{ runner.temp }}/demo-video/source-ai-record.json
            ${{ runner.temp }}/demo-video/source-human-record.json
            ${{ runner.temp }}/demo-video/captions.json
            ${{ runner.temp }}/demo-video/receipt.json
            ${{ runner.temp }}/demo-video/framing.json
            ${{ runner.temp }}/demo-video/review-*.png
          retention-days: 7
          if-no-files-found: error

  bgm:
    if: github.event_name == 'workflow_dispatch' && inputs.add_bgm_only
    name: Add and verify original BGM without changing the video
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: '43611290885'
          name: demo-video-7b364c9ad693c35d00ca8edf1c428f19658b8d04
          path: ${{ runner.temp }}/bgm-source
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: node --test scripts/ci/demo-bgm.test.mjs
      - run: node scripts/demo-bgm.mjs "$RUNNER_TEMP/bgm-source" "$RUNNER_TEMP/demo-bgm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: demo-bgm-${{ github.sha }}
          path: |
            ${{ runner.temp }}/demo-bgm/*-bgm.mp4
            ${{ runner.temp }}/demo-bgm/bgm-receipt.json
          retention-days: 7
          if-no-files-found: error
