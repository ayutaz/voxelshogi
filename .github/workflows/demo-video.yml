name: Demo video

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'record-demo' && github.event.pull_request.head.repo.full_name == github.repository)
    name: Record the real arena and export the fifteen-second demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install the recording tools and Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          pnpm exec playwright install --with-deps chromium
      - run: pnpm wasm
      - run: pnpm build
      - name: Capture and validate the real game
        working-directory: .
        run: node scripts/demo-video.mjs "$RUNNER_TEMP/demo-video"
      - name: Save only reviewable deliverables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: demo-video-${{ github.sha }}
          path: |
            ${{ runner.temp }}/demo-video/demo-main.mp4
            ${{ runner.temp }}/demo-video/hook-a.mp4
            ${{ runner.temp }}/demo-video/hook-b.mp4
            ${{ runner.temp }}/demo-video/poster.png
            ${{ runner.temp }}/demo-video/contact-sheet.png
            ${{ runner.temp }}/demo-video/source-ai-record.json
            ${{ runner.temp }}/demo-video/captions.json
            ${{ runner.temp }}/demo-video/receipt.json
          retention-days: 7
          if-no-files-found: error
