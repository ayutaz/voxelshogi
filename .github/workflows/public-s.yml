name: Public trained S

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'verify-public-s' && github.event.pull_request.head.repo.full_name == github.repository)
    name: Anonymous S downloads and three real human matches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: node scripts/verify-public-s.mjs "$RUNNER_TEMP/public-s-verification.json"
      - run: node scripts/prepare-public-runtime.mjs
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - run: pnpm --dir apps/web wasm
      - run: pnpm --dir apps/web build
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --dir apps/web exec playwright test -c public-model-playwright.config.ts
        env:
          PW_CHANNEL: ''
          E2E_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: public-s-${{ github.sha }}
          path: |
            ${{ runner.temp }}/public-s-verification.json
            apps/web/public-model-test-results/**/attachments/public-s-*.png
            apps/web/public-model-test-results/**/test-failed-*.png
          retention-days: 7
          if-no-files-found: error
