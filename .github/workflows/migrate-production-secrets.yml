# Temporary, manual migration. Remove after verified production deployment.
name: Migrate production secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r scripts/ci/migration-requirements.txt
      - name: Seal directly to this repository's production key
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox
          # This is GitHub's production-environment public key, not a credential.
          # It is fixed here: dispatchers cannot substitute their own recipient key.
          box = SealedBox(PublicKey(base64.b64decode('wcH4wFGoQvHV7PlOkLUJkKfOnm0QUBBYkOf3pC0lV2c=', validate=True)))
          sealed = {}
          for name in ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID']:
              value = os.environ[name]
              if not value.strip():
                  raise RuntimeError('Missing ' + name)
              sealed[name] = {
                  'key_id': '3380204578043523366',
                  'encrypted_value': base64.b64encode(box.encrypt(value.encode())).decode(),
              }
          Path('production-sealed.json').write_text(json.dumps(sealed))
          print('Sealed two values for the fixed production key; plaintext was not exported.')
          PY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-sealed
          path: production-sealed.json
          retention-days: 1
          if-no-files-found: error
