name: CI change scope
on:
  workflow_call:
    outputs:
      rust:
        value: ${{ jobs.scope.outputs.rust }}
      web:
        value: ${{ jobs.scope.outputs.web }}
      python:
        value: ${{ jobs.scope.outputs.python }}
      models:
        value: ${{ jobs.scope.outputs.models }}
      dependencies:
        value: ${{ jobs.scope.outputs.dependencies }}
      controls:
        value: ${{ jobs.scope.outputs.controls }}
permissions:
  contents: read
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      web: ${{ steps.scope.outputs.web }}
      python: ${{ steps.scope.outputs.python }}
      models: ${{ steps.scope.outputs.models }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      controls: ${{ steps.scope.outputs.controls }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - id: scope
        run: node scripts/ci/ci-scope.mjs
