name: Quality measurements

on:
  workflow_call:
    inputs:
      full_mutations:
        description: Run the complete core mutation catalog
        type: boolean
        default: false
  pull_request:
  schedule:
    - cron: '43 16 * * 0'
  workflow_dispatch:
    inputs:
      full_mutations:
        description: Run all core mutations in addition to the known regressions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    uses: ./.github/workflows/change-scope.yml

  rust-coverage:
    name: Rust core coverage
    needs: [scope]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Avoid the LLVM coverage mismatches observed with opt-level 2.
      CARGO_PROFILE_TEST_OPT_LEVEL: 0
    steps:
      - name: Validate CI change scope
        working-directory: .
        run: |
          test "$SCOPE_RESULT" = success
          for flag in "$RUST_SCOPE" "$WEB_SCOPE" "$PYTHON_SCOPE" "$MODELS_SCOPE" "$DEPENDENCIES_SCOPE" "$CONTROLS_SCOPE" "$DEEP_SCOPE"; do
            case "$flag" in true|false) ;; *) echo 'Invalid CI change scope' >&2; exit 1 ;; esac
          done
          if [ "$REQUIRED" = false ]; then
            echo '### Expensive checks omitted: this job is not required for these paths and this event.' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUST_SCOPE: ${{ needs.scope.outputs.rust }}
          WEB_SCOPE: ${{ needs.scope.outputs.web }}
          PYTHON_SCOPE: ${{ needs.scope.outputs.python }}
          MODELS_SCOPE: ${{ needs.scope.outputs.models }}
          DEPENDENCIES_SCOPE: ${{ needs.scope.outputs.dependencies }}
          CONTROLS_SCOPE: ${{ needs.scope.outputs.controls }}
          DEEP_SCOPE: ${{ needs.scope.outputs.deep }}
          REQUIRED: ${{ needs.scope.outputs.deep == 'true' && (needs.scope.outputs.rust == 'true') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.rust == 'true'
      - run: rustup show
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.rust == 'true'
      - run: rustup component add llvm-tools-preview
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.rust == 'true'
        with:
          key: coverage
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.rust == 'true'
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Measure core coverage
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.rust == 'true'
        run: |
          mkdir -p coverage/rust
          cargo llvm-cov --locked -p voxelshogi-core --ignore-filename-regex '/(tests|examples)/' --lcov --output-path coverage/rust/lcov.info
          cargo llvm-cov report --ignore-filename-regex '/(tests|examples)/' --html --output-dir coverage/rust/html
          cargo llvm-cov report --ignore-filename-regex '/(tests|examples)/' --json --summary-only --output-path coverage/rust/summary.json
          test -s coverage/rust/lcov.info
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.rust == 'true'
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.rust == 'true'
        with:
          version: '0.11.23'
          enable-cache: false
      - name: Summarize core coverage
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.rust == 'true'
        run: |
          uv run --no-project --python "$(cat .python-version)" python - <<'PY'
          import json, os
          totals = json.load(open('coverage/rust/summary.json'))['data'][0]['totals']
          assert totals['lines']['count'] > 0, 'No measured Rust lines'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### Rust core coverage\n\n')
              for kind in ['lines', 'functions', 'regions']:
                  value = totals[kind]
                  f.write(f"- {kind}: {value['percent']:.2f}% ({value['covered']}/{value['count']})\n")
              f.write('\nIntegration/reference test files are excluded. Native coverage does not measure the WASM wrapper.\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.rust == 'true'
        with:
          name: rust-coverage
          path: coverage/rust
          retention-days: 7
          if-no-files-found: error

  web-coverage:
    name: Web unit coverage
    needs: [scope]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate CI change scope
        working-directory: .
        run: |
          test "$SCOPE_RESULT" = success
          for flag in "$RUST_SCOPE" "$WEB_SCOPE" "$PYTHON_SCOPE" "$MODELS_SCOPE" "$DEPENDENCIES_SCOPE" "$CONTROLS_SCOPE" "$DEEP_SCOPE"; do
            case "$flag" in true|false) ;; *) echo 'Invalid CI change scope' >&2; exit 1 ;; esac
          done
          if [ "$REQUIRED" = false ]; then
            echo '### Expensive checks omitted: this job is not required for these paths and this event.' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUST_SCOPE: ${{ needs.scope.outputs.rust }}
          WEB_SCOPE: ${{ needs.scope.outputs.web }}
          PYTHON_SCOPE: ${{ needs.scope.outputs.python }}
          MODELS_SCOPE: ${{ needs.scope.outputs.models }}
          DEPENDENCIES_SCOPE: ${{ needs.scope.outputs.dependencies }}
          CONTROLS_SCOPE: ${{ needs.scope.outputs.controls }}
          DEEP_SCOPE: ${{ needs.scope.outputs.deep }}
          REQUIRED: ${{ needs.scope.outputs.deep == 'true' && (needs.scope.outputs.web == 'true') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
      - run: rustup show
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        working-directory: apps/web
      - run: node scripts/ci/check-versions.mjs
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
      - run: pnpm wasm
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        working-directory: apps/web
      - run: pnpm coverage
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        working-directory: apps/web
      - name: Detect Worker and store regressions with injected web mutations
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        run: node scripts/ci/mutation-web.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true' && always()
        with:
          name: web-mutation-regressions
          path: coverage/web-mutations
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        with:
          version: '0.11.23'
          enable-cache: false
      - name: Summarize Web coverage
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        run: |
          uv run --no-project --python "$(cat .python-version)" python - <<'PY'
          import json, os
          totals = json.load(open('apps/web/coverage/coverage-summary.json'))['total']
          assert totals['lines']['total'] > 0, 'No measured Web lines'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### Web unit coverage\n\n')
              for kind in ['lines', 'functions', 'branches']:
                  value = totals[kind]
                  f.write(f"- {kind}: {value['pct']:.2f}% ({value['covered']}/{value['total']})\n")
              f.write('\nIncludes unimported UI/3D source; generated WASM glue is excluded. Browser E2E coverage is not included.\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        with:
          name: web-coverage
          path: apps/web/coverage
          retention-days: 7
          if-no-files-found: error

  mutation-regressions:
    name: Known mutation regressions
    needs: [scope]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate CI change scope
        working-directory: .
        run: |
          test "$SCOPE_RESULT" = success
          for flag in "$RUST_SCOPE" "$WEB_SCOPE" "$PYTHON_SCOPE" "$MODELS_SCOPE" "$DEPENDENCIES_SCOPE" "$CONTROLS_SCOPE" "$DEEP_SCOPE"; do
            case "$flag" in true|false) ;; *) echo 'Invalid CI change scope' >&2; exit 1 ;; esac
          done
          if [ "$REQUIRED" = false ]; then
            echo '### Expensive checks omitted: this job is not required for these paths and this event.' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUST_SCOPE: ${{ needs.scope.outputs.rust }}
          WEB_SCOPE: ${{ needs.scope.outputs.web }}
          PYTHON_SCOPE: ${{ needs.scope.outputs.python }}
          MODELS_SCOPE: ${{ needs.scope.outputs.models }}
          DEPENDENCIES_SCOPE: ${{ needs.scope.outputs.dependencies }}
          CONTROLS_SCOPE: ${{ needs.scope.outputs.controls }}
          DEEP_SCOPE: ${{ needs.scope.outputs.deep }}
          REQUIRED: ${{ needs.scope.outputs.deep == 'true' && (needs.scope.outputs.rust == 'true' || needs.scope.outputs.controls == 'true') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.rust == 'true' || needs.scope.outputs.controls == 'true')
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.rust == 'true' || needs.scope.outputs.controls == 'true')
        with:
          python-version-file: .python-version
      - run: rustup show
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.rust == 'true' || needs.scope.outputs.controls == 'true')
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.rust == 'true' || needs.scope.outputs.controls == 'true')
        with:
          node-version-file: .node-version
      - run: node --test scripts/ci/*.test.mjs
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.rust == 'true' || needs.scope.outputs.controls == 'true')
      - run: node scripts/ci/mutation-smoke.mjs
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.rust == 'true' || needs.scope.outputs.controls == 'true')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.rust == 'true' || needs.scope.outputs.controls == 'true') && always()
        with:
          name: mutation-regressions
          path: coverage/mutations
          retention-days: 7
          if-no-files-found: error

  full-mutations:
    name: Full core mutations (${{ matrix.shard }}/8)
    if: (github.event_name == 'schedule' && github.workflow == 'Quality measurements') || inputs.full_mutations
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-mutants@27.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Test core mutants
        run: |
          mutant_status=0
          # Invoke the binary directly: `cargo mutants` resets CARGO to Cargo itself.
          toolchain="$(rustup show active-toolchain)"
          RUSTUP_TOOLCHAIN="${toolchain%% *}" VOXELSHOGI_MUTATION_CARGO="$(rustup which cargo)" CARGO="$GITHUB_WORKSPACE/scripts/ci/mutation-cargo.sh" \
            cargo-mutants mutants --package voxelshogi-core --shard "$SHARD/8" --timeout 90 --jobs 2 --cargo-arg=--locked || mutant_status=$?
          # Exit 2 means survivors; only the exact, source-pinned equivalences may pass review.
          if [ "$mutant_status" -ne 0 ] && [ "$mutant_status" -ne 2 ]; then
            exit "$mutant_status"
          fi
          node scripts/ci/mutation-report.mjs mutants.out
        env:
          SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: full-mutations-${{ matrix.shard }}
          path: mutants.out
          retention-days: 7
          if-no-files-found: error
