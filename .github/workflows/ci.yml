name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    name: Web (wasm, unit, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm wasm
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm vite build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          PW_CHANNEL: ''
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: [rust, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/download-artifact@v8
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          name: web-dist
          path: apps/web/dist
      - name: Deploy (skipped until CLOUDFLARE_API_TOKEN is configured)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.152.0 deploy
      - name: Smoke test
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          url="https://voxelshogi.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev"
          if [ -n "${{ vars.WORKERS_SUBDOMAIN }}" ]; then
            curl -fsS "$url/" | grep -q "VoxelShogi Arena"
          else
            echo "WORKERS_SUBDOMAIN variable not set; skipping smoke test"
          fi
      - name: Report skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Cloudflare secrets are not configured; deploy skipped."
