name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '3 17 * * 0'
  workflow_dispatch:
    inputs:
      m5_live:
        description: Validate the fixed public Shogitter cohort on Linux
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  scope:
    uses: ./.github/workflows/change-scope.yml

  quality:
    name: Deep quality measurements
    needs: [scope]
    if: needs.scope.outputs.deep == 'true'
    uses: ./.github/workflows/quality.yml
    with:
      full_mutations: false
    permissions:
      contents: read

  audit:
    name: Dependency audit
    needs: [scope]
    if: needs.scope.outputs.dependencies == 'true'
    uses: ./.github/workflows/dependency-audit.yml
    permissions:
      contents: read

  dependency-review:
    name: Dependency review
    needs: [scope]
    if: github.event_name == 'pull_request' && needs.scope.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  lint:
    name: Lint (workflows, shell, web)
    needs: [scope]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate CI change scope
        working-directory: .
        run: |
          test "$SCOPE_RESULT" = success
          for flag in "$RUST_SCOPE" "$WEB_SCOPE" "$PYTHON_SCOPE" "$MODELS_SCOPE" "$DEPENDENCIES_SCOPE" "$CONTROLS_SCOPE" "$DEEP_SCOPE"; do
            case "$flag" in true|false) ;; *) echo 'Invalid CI change scope' >&2; exit 1 ;; esac
          done
          if [ "$REQUIRED" = false ]; then
            echo '### Expensive checks omitted: this job is not required for these paths and this event.' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUST_SCOPE: ${{ needs.scope.outputs.rust }}
          WEB_SCOPE: ${{ needs.scope.outputs.web }}
          PYTHON_SCOPE: ${{ needs.scope.outputs.python }}
          MODELS_SCOPE: ${{ needs.scope.outputs.models }}
          DEPENDENCIES_SCOPE: ${{ needs.scope.outputs.dependencies }}
          CONTROLS_SCOPE: ${{ needs.scope.outputs.controls }}
          DEEP_SCOPE: ${{ needs.scope.outputs.deep }}
          REQUIRED: ${{ needs.scope.outputs.controls == 'true' || needs.scope.outputs.web == 'true' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        if: needs.scope.outputs.controls == 'true'
        with:
          tool: shellcheck@0.11.0
      - name: Install actionlint 1.7.12
        if: needs.scope.outputs.controls == 'true'
        run: |
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - run: actionlint -color
        if: needs.scope.outputs.controls == 'true'
      - run: shellcheck scripts/*.sh scripts/ci/*.sh
        if: needs.scope.outputs.controls == 'true'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: needs.scope.outputs.web == 'true'
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: ${{ needs.scope.outputs.web == 'true' && 'pnpm' || '' }}
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: needs.scope.outputs.web == 'true'
        working-directory: apps/web
      - run: pnpm lint
        if: needs.scope.outputs.web == 'true'
        working-directory: apps/web
      - run: node --test scripts/ci/*.test.mjs
        if: needs.scope.outputs.controls == 'true'
      - name: Validate scope and required gate contracts
        run: node --test scripts/ci/ci-scope.test.mjs scripts/ci/gate.test.mjs
      - run: node scripts/ci/mutation-controls.mjs
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.controls == 'true')

  msrv:
    name: Rust MSRV (1.85)
    needs: [scope]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate CI change scope
        working-directory: .
        run: |
          test "$SCOPE_RESULT" = success
          for flag in "$RUST_SCOPE" "$WEB_SCOPE" "$PYTHON_SCOPE" "$MODELS_SCOPE" "$DEPENDENCIES_SCOPE" "$CONTROLS_SCOPE" "$DEEP_SCOPE"; do
            case "$flag" in true|false) ;; *) echo 'Invalid CI change scope' >&2; exit 1 ;; esac
          done
          if [ "$REQUIRED" = false ]; then
            echo '### Expensive checks omitted: this job is not required for these paths and this event.' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUST_SCOPE: ${{ needs.scope.outputs.rust }}
          WEB_SCOPE: ${{ needs.scope.outputs.web }}
          PYTHON_SCOPE: ${{ needs.scope.outputs.python }}
          MODELS_SCOPE: ${{ needs.scope.outputs.models }}
          DEPENDENCIES_SCOPE: ${{ needs.scope.outputs.dependencies }}
          CONTROLS_SCOPE: ${{ needs.scope.outputs.controls }}
          DEEP_SCOPE: ${{ needs.scope.outputs.deep }}
          REQUIRED: ${{ needs.scope.outputs.deep == 'true' && (needs.scope.outputs.rust == 'true') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.rust == 'true'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.rust == 'true'
        with:
          python-version-file: .python-version
      - run: rustup toolchain install 1.85.0 --profile minimal
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.rust == 'true'
        with:
          key: msrv
      - run: cargo +1.85.0 test --locked --workspace --all-targets
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.rust == 'true'

  gate:
    name: CI Gate
    # Keep fail/cancel detection; do not serialize workflows behind a queued gate.
    if: always()
    needs: [scope, lint, rust, msrv, web, e2e-runtime, audit, dependency-review, python, python-model-mutations, python-training-mutations, models, quality]
    outputs:
      models_publication: ${{ needs.scope.outputs.deep == 'true' && needs.web.outputs.models_publication || 'false' }}
      web_required: ${{ needs.scope.outputs.web }}
      deep_required: ${{ needs.scope.outputs.deep }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: node scripts/ci/gate.mjs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}

  python:
    name: Python engine and model contracts
    needs: [scope]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate CI change scope
        working-directory: .
        run: |
          test "$SCOPE_RESULT" = success
          for flag in "$RUST_SCOPE" "$WEB_SCOPE" "$PYTHON_SCOPE" "$MODELS_SCOPE" "$DEPENDENCIES_SCOPE" "$CONTROLS_SCOPE" "$DEEP_SCOPE"; do
            case "$flag" in true|false) ;; *) echo 'Invalid CI change scope' >&2; exit 1 ;; esac
          done
          if [ "$REQUIRED" = false ]; then
            echo '### Expensive checks omitted: this job is not required for these paths and this event.' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUST_SCOPE: ${{ needs.scope.outputs.rust }}
          WEB_SCOPE: ${{ needs.scope.outputs.web }}
          PYTHON_SCOPE: ${{ needs.scope.outputs.python }}
          MODELS_SCOPE: ${{ needs.scope.outputs.models }}
          DEPENDENCIES_SCOPE: ${{ needs.scope.outputs.dependencies }}
          CONTROLS_SCOPE: ${{ needs.scope.outputs.controls }}
          DEEP_SCOPE: ${{ needs.scope.outputs.deep }}
          REQUIRED: ${{ needs.scope.outputs.python == 'true' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.python == 'true'
      - run: rustup show
        if: needs.scope.outputs.python == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.scope.outputs.python == 'true'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.scope.outputs.python == 'true'
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.scope.outputs.python == 'true'
        with:
          version: '0.11.23'
          enable-cache: true
      - run: uv sync --locked
        if: needs.scope.outputs.python == 'true'
      - name: Validate external CUDA lock without installing GPU packages
        if: needs.scope.outputs.python == 'true'
        run: uv lock --project infrastructure/cuda --check
      - run: uv run --locked ruff check export training crates/voxelshogi-python/python scripts/ci/mutation-*.py scripts/ci/prepare-m6-model.py
        if: needs.scope.outputs.python == 'true'
      - run: uv run --locked ruff format --check export training crates/voxelshogi-python/python scripts/ci/mutation-*.py scripts/ci/prepare-m6-model.py
        if: needs.scope.outputs.python == 'true'
      - name: Fast Python unit contracts
        if: needs.scope.outputs.python == 'true' && needs.scope.outputs.deep == 'false'
        run: uv run --locked pytest -q --ignore-glob='training/tests/*_native.py'
      - name: Full Python unit and native integration contracts
        if: needs.scope.outputs.python == 'true' && needs.scope.outputs.deep == 'true'
        run: uv run --locked pytest -q
      - name: Verify remote pilot on CI CPU without claiming GPU measurements
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.python == 'true')
        run: uv run --locked python -m training.pilot runs/m4/ci-pilot --provider ci --allow-no-gpu --smoke --seconds 30
      - name: Validate private M5 sources and report only aggregate results
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.python == 'true' && github.event_name == 'workflow_dispatch' && inputs.m5_live
        timeout-minutes: 5
        run: uv run --locked python -m training.shogitter runs/m5/compatibility

  python-model-mutations:
    name: Python model mutation regressions
    needs: [scope]
    if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.python == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.23'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python scripts/ci/mutation-python.py

  python-training-mutations:
    name: Python training mutations (${{ matrix.shard }}/8)
    needs: [scope]
    if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.python == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.23'
          enable-cache: true
      - run: uv sync --locked
      - name: Verify this shard's baseline and mutations
        run: uv run --locked python scripts/ci/mutation-training.py --shard "$SHARD" --shards 8
        env:
          SHARD: ${{ matrix.shard }}

  models:
    name: Browser model inference (real WASM)
    needs: [scope]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate CI change scope
        working-directory: .
        run: |
          test "$SCOPE_RESULT" = success
          for flag in "$RUST_SCOPE" "$WEB_SCOPE" "$PYTHON_SCOPE" "$MODELS_SCOPE" "$DEPENDENCIES_SCOPE" "$CONTROLS_SCOPE" "$DEEP_SCOPE"; do
            case "$flag" in true|false) ;; *) echo 'Invalid CI change scope' >&2; exit 1 ;; esac
          done
          if [ "$REQUIRED" = false ]; then
            echo '### Expensive checks omitted: this job is not required for these paths and this event.' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUST_SCOPE: ${{ needs.scope.outputs.rust }}
          WEB_SCOPE: ${{ needs.scope.outputs.web }}
          PYTHON_SCOPE: ${{ needs.scope.outputs.python }}
          MODELS_SCOPE: ${{ needs.scope.outputs.models }}
          DEPENDENCIES_SCOPE: ${{ needs.scope.outputs.dependencies }}
          CONTROLS_SCOPE: ${{ needs.scope.outputs.controls }}
          DEEP_SCOPE: ${{ needs.scope.outputs.deep }}
          REQUIRED: ${{ needs.scope.outputs.deep == 'true' && (needs.scope.outputs.models == 'true') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
      - run: rustup show
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
        with:
          version: '0.11.23'
          enable-cache: true
      - run: uv sync --locked
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
      - run: pnpm --dir apps/web wasm
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
      - run: uv run --locked python -m export.generate runs/m3/ci
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
      - name: Prepare synthetic private arena fixture without training or publication
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
        run: uv run --locked python scripts/ci/prepare-m6-model.py
      - name: Prepare local-only models without publishing binaries
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
        run: node scripts/prepare-inference.mjs runs/m3/ci apps/web/public/models/m3 --local
      - run: pnpm --dir apps/web build
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
      - run: pnpm --dir apps/web exec playwright install chromium
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
      - name: Verify research Worker private channel without loading models
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
        run: node scripts/research-worker-channel-smoke.mjs
      - name: Verify all formats and real Worker interaction
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
        run: pnpm exec playwright test -c model-playwright.config.ts
        working-directory: apps/web
        env:
          PW_CHANNEL: ''
      - name: Verify local-file models in AI spectator and human versus AI
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.models == 'true'
        run: pnpm exec playwright test -c arena-model-playwright.config.ts
        working-directory: apps/web
        env:
          PW_CHANNEL: ''
      # This private verification job does not publish model/trace artifacts.

  rust:
    name: Rust (fmt, clippy, test)
    needs: [scope]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate CI change scope
        working-directory: .
        run: |
          test "$SCOPE_RESULT" = success
          for flag in "$RUST_SCOPE" "$WEB_SCOPE" "$PYTHON_SCOPE" "$MODELS_SCOPE" "$DEPENDENCIES_SCOPE" "$CONTROLS_SCOPE" "$DEEP_SCOPE"; do
            case "$flag" in true|false) ;; *) echo 'Invalid CI change scope' >&2; exit 1 ;; esac
          done
          if [ "$REQUIRED" = false ]; then
            echo '### Expensive checks omitted: this job is not required for these paths and this event.' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUST_SCOPE: ${{ needs.scope.outputs.rust }}
          WEB_SCOPE: ${{ needs.scope.outputs.web }}
          PYTHON_SCOPE: ${{ needs.scope.outputs.python }}
          MODELS_SCOPE: ${{ needs.scope.outputs.models }}
          DEPENDENCIES_SCOPE: ${{ needs.scope.outputs.dependencies }}
          CONTROLS_SCOPE: ${{ needs.scope.outputs.controls }}
          DEEP_SCOPE: ${{ needs.scope.outputs.deep }}
          REQUIRED: ${{ needs.scope.outputs.rust == 'true' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.rust == 'true'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.scope.outputs.rust == 'true'
        with:
          python-version-file: .python-version
      - run: rustup show
        if: needs.scope.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.scope.outputs.rust == 'true'
      - run: cargo fmt --all --check
        if: needs.scope.outputs.rust == 'true'
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        if: needs.scope.outputs.rust == 'true'
      - run: cargo test --locked --workspace
        if: needs.scope.outputs.rust == 'true'

  web:
    name: Web (wasm, unit, build, e2e)
    needs: [scope]
    # This image already includes Chrome's runtime libraries. Avoid apt's slow
    # font/library upgrades; the actual Chromium launch/E2E still validates them.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      models_publication: ${{ steps.model_policy.outputs.publication || 'false' }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Validate CI change scope
        working-directory: .
        run: |
          test "$SCOPE_RESULT" = success
          for flag in "$RUST_SCOPE" "$WEB_SCOPE" "$PYTHON_SCOPE" "$MODELS_SCOPE" "$DEPENDENCIES_SCOPE" "$CONTROLS_SCOPE" "$DEEP_SCOPE"; do
            case "$flag" in true|false) ;; *) echo 'Invalid CI change scope' >&2; exit 1 ;; esac
          done
          if [ "$REQUIRED" = false ]; then
            echo '### Expensive checks omitted: this job is not required for these paths and this event.' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUST_SCOPE: ${{ needs.scope.outputs.rust }}
          WEB_SCOPE: ${{ needs.scope.outputs.web }}
          PYTHON_SCOPE: ${{ needs.scope.outputs.python }}
          MODELS_SCOPE: ${{ needs.scope.outputs.models }}
          DEPENDENCIES_SCOPE: ${{ needs.scope.outputs.dependencies }}
          CONTROLS_SCOPE: ${{ needs.scope.outputs.controls }}
          DEEP_SCOPE: ${{ needs.scope.outputs.deep }}
          REQUIRED: ${{ needs.scope.outputs.web == 'true' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.web == 'true'
      - run: rustup show
        if: needs.scope.outputs.web == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.scope.outputs.web == 'true'
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        if: needs.scope.outputs.web == 'true'
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: needs.scope.outputs.web == 'true'
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.scope.outputs.web == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: needs.scope.outputs.web == 'true'
      - run: node ../../scripts/ci/check-versions.mjs
        if: needs.scope.outputs.web == 'true'
      - run: pnpm wasm
        if: needs.scope.outputs.web == 'true'
      - name: Verify fixed model inputs against Rust WASM
        if: needs.scope.outputs.web == 'true'
        run: node ../../scripts/model-fixtures.mjs --check
      - run: pnpm typecheck
        if: needs.scope.outputs.web == 'true'
      - run: pnpm test
        if: needs.scope.outputs.web == 'true'
      - name: Compare native and real WASM search
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.web == 'true')
        run: node ../../scripts/ci/search-parity.mjs
      - name: Read explicit model publication policy
        if: needs.scope.outputs.web == 'true'
        id: model_policy
        run: |
          if [ "$DEEP_SCOPE" = true ]; then
            node scripts/model-publication.mjs export/publication.json
          else
            GITHUB_OUTPUT="$RUNNER_TEMP/model-policy-check" node scripts/model-publication.mjs export/publication.json
            echo 'publication=false' >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
        env:
          DEEP_SCOPE: ${{ needs.scope.outputs.deep }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.web == 'true' && (steps.model_policy.outputs.publication == 'true'))
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.web == 'true' && (steps.model_policy.outputs.publication == 'true'))
        with:
          version: '0.11.23'
          enable-cache: true
      - name: Generate approved model variants
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.web == 'true' && (steps.model_policy.outputs.publication == 'true'))
        working-directory: .
        run: |
          uv sync --locked
          uv run --locked python -m export.generate runs/m3/distribution --license Apache-2.0
          node scripts/model-publication.mjs export/publication.json runs/m3/distribution
          node scripts/prepare-inference.mjs runs/m3/distribution apps/web/public/models/m3
      - run: pnpm build
        if: needs.scope.outputs.web == 'true'
      - run: pnpm exec playwright install chromium
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.web == 'true')
      - name: Install Japanese fonts for layout evidence
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.web == 'true')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify approved distribution with real model E2E
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.web == 'true' && (steps.model_policy.outputs.publication == 'true'))
        run: pnpm exec playwright test -c model-playwright.config.ts
        env:
          PW_CHANNEL: ''
      - run: pnpm e2e
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.web == 'true')
        env:
          PW_CHANNEL: ''
          E2E_COMMIT: ${{ github.sha }}
      - name: Save launch layout evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true' && !cancelled()
        with:
          name: launch-layout-evidence
          path: |
            apps/web/test-results/launch-*/attachments/*.png
            apps/web/test-results/redesign-*/attachments/*.png
            apps/web/test-results/*/test-failed-*.png
          retention-days: 2
          if-no-files-found: error
      - name: Repeat search and camera regression without retries
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.web == 'true')
        run: pnpm e2e ai.spec.ts --grep '2D/3D and camera' --repeat-each=3 --workers=1 --retries=0
        env:
          PW_CHANNEL: ''
          E2E_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.web == 'true' && (failure()))
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.web == 'true')
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.scope.outputs.deep == 'true' && (needs.scope.outputs.web == 'true')
        with:
          name: web-e2e-wasm
          path: apps/web/src/wasm/pkg
          retention-days: 7
          if-no-files-found: error

  e2e-runtime:
    name: Public E2E runtime handoff
    needs: [scope, web]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate CI change scope
        working-directory: .
        run: |
          test "$SCOPE_RESULT" = success
          for flag in "$RUST_SCOPE" "$WEB_SCOPE" "$PYTHON_SCOPE" "$MODELS_SCOPE" "$DEPENDENCIES_SCOPE" "$CONTROLS_SCOPE" "$DEEP_SCOPE"; do
            case "$flag" in true|false) ;; *) echo 'Invalid CI change scope' >&2; exit 1 ;; esac
          done
          if [ "$REQUIRED" = false ]; then
            echo '### Expensive checks omitted: this job is not required for these paths and this event.' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUST_SCOPE: ${{ needs.scope.outputs.rust }}
          WEB_SCOPE: ${{ needs.scope.outputs.web }}
          PYTHON_SCOPE: ${{ needs.scope.outputs.python }}
          MODELS_SCOPE: ${{ needs.scope.outputs.models }}
          DEPENDENCIES_SCOPE: ${{ needs.scope.outputs.dependencies }}
          CONTROLS_SCOPE: ${{ needs.scope.outputs.controls }}
          DEEP_SCOPE: ${{ needs.scope.outputs.deep }}
          REQUIRED: ${{ needs.scope.outputs.deep == 'true' && (needs.scope.outputs.web == 'true') }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        working-directory: apps/web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        with:
          name: web-e2e-wasm
          path: apps/web/src/wasm/pkg
          digest-mismatch: error
      # A fresh checkout has no generated WASM. Collecting the actual suite
      # exercises its Node imports using only the same-run artifact, on PRs too.
      - run: pnpm e2e --list
        if: needs.scope.outputs.deep == 'true' && needs.scope.outputs.web == 'true'
        working-directory: apps/web

  deploy:
    name: Deploy to Cloudflare
    needs: [gate]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gate.result == 'success' && needs.gate.outputs.web_required == 'true' && needs.gate.outputs.deep_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://voxelshogi.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec playwright install chromium
        working-directory: apps/web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: apps/web/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-e2e-wasm
          path: apps/web/src/wasm/pkg
          digest-mismatch: error
      - name: Validate public E2E imports before publication
        run: pnpm e2e --list
        working-directory: apps/web
      - name: Check current main after acquiring production lock
        id: candidate
        run: node scripts/ci/deployment.mjs candidate
      - name: Validate production configuration
        id: config
        if: steps.candidate.outputs.current == 'true'
        run: node scripts/ci/deployment.mjs config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
      - name: Publish tested artifact
        id: publish
        if: steps.candidate.outputs.current == 'true'
        run: |
          pnpm --dir apps/web exec wrangler deploy --message "commit:$GITHUB_SHA" | tee "$RUNNER_TEMP/deploy.log"
          node scripts/ci/deployment.mjs record-version "$RUNNER_TEMP/deploy.log"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify published commit
        id: verify
        if: steps.candidate.outputs.current == 'true'
        run: node scripts/ci/deployment.mjs verify
      - name: Verify and warm the anonymous S gateway
        if: steps.candidate.outputs.current == 'true'
        run: node scripts/verify-public-model-gateway.mjs public-s-gateway.json --public
      - name: Public E2E
        id: e2e
        if: steps.candidate.outputs.current == 'true'
        run: pnpm e2e
        working-directory: apps/web
        env:
          PW_CHANNEL: ''
          E2E_COMMIT: ${{ github.sha }}
      - name: Repeat public search and camera regression without retries
        if: steps.candidate.outputs.current == 'true'
        run: pnpm e2e ai.spec.ts --grep '2D/3D and camera' --repeat-each=3 --workers=1 --retries=0
        working-directory: apps/web
        env:
          PW_CHANNEL: ''
          E2E_COMMIT: ${{ github.sha }}
      - name: Audit exact public application, model and runtime files
        if: steps.candidate.outputs.current == 'true' && needs.gate.outputs.models_publication == 'true'
        run: node scripts/verify-model-distribution.mjs "$E2E_BASE_URL" model-distribution.json
        env:
          E2E_COMMIT: ${{ github.sha }}
      - name: Public model E2E on the exact approved distribution
        if: steps.candidate.outputs.current == 'true' && needs.gate.outputs.models_publication == 'true'
        run: pnpm exec playwright test -c model-playwright.config.ts
        working-directory: apps/web
        env:
          PW_CHANNEL: ''
          E2E_BASE_URL: https://voxelshogi.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: production-failure
          path: |
            apps/web/test-results
            deployment-info.json
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success() && steps.candidate.outputs.current == 'true'
        with:
          name: production-${{ github.sha }}
          path: |
            deployment-info.json
            model-distribution.json
            public-s-gateway.json
          retention-days: 30
          if-no-files-found: error
      - name: Report deployment phases
        if: always()
        run: |
          {
            echo '### Production deployment'
            echo "- Commit: $GITHUB_SHA"
            echo "- Current main candidate: $CURRENT"
            echo "- Configuration: $CONFIG_RESULT"
            echo "- Publish: $PUBLISH_RESULT"
            echo "- Published commit verification: $VERIFY_RESULT"
            echo "- Public E2E: $E2E_RESULT"
            if [ "$CURRENT" = false ]; then
              echo '- Stale candidate was intentionally skipped; no publication occurred.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CURRENT: ${{ steps.candidate.outputs.current }}
          CONFIG_RESULT: ${{ steps.config.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          E2E_RESULT: ${{ steps.e2e.outcome }}
