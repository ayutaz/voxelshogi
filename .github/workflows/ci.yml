name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  audit:
    name: Dependency audit
    uses: ./.github/workflows/dependency-audit.yml
    permissions:
      contents: read

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  lint:
    name: Lint (workflows, shell, web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: actionlint@1.7.12,shellcheck@0.11.0
      - run: actionlint -color
      - run: shellcheck scripts/*.sh
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm lint
        working-directory: apps/web
      - run: node --test scripts/ci/*.test.mjs

  msrv:
    name: Rust MSRV (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install 1.85.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: msrv
      - run: cargo +1.85.0 test --locked --workspace --all-targets

  gate:
    name: CI Gate
    if: always()
    needs: [lint, rust, msrv, web, audit, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: node scripts/ci/gate.mjs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  web:
    name: Web (wasm, unit, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node ../../scripts/ci/check-versions.mjs
      - run: pnpm wasm
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm vite build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          PW_CHANNEL: ''
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: [gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: apps/web
    env:
      CF_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.CF_CONFIGURED == 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: env.CF_CONFIGURED == 'true'
        with:
          name: web-dist
          path: apps/web/dist
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: env.CF_CONFIGURED == 'true'
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: env.CF_CONFIGURED == 'true'
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
        if: env.CF_CONFIGURED == 'true'
      - name: Deploy
        if: env.CF_CONFIGURED == 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        if: env.CF_CONFIGURED == 'true'
        run: |
          url="https://voxelshogi.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev"
          if [ -n "${{ vars.WORKERS_SUBDOMAIN }}" ]; then
            curl -fsS "$url/" | grep -q "VoxelShogi Arena"
          else
            echo "WORKERS_SUBDOMAIN variable not set; skipping smoke test"
          fi
      - name: Report skipped deploy
        if: env.CF_CONFIGURED != 'true'
        # checkout is skipped here, so apps/web does not exist
        working-directory: .
        run: echo "::notice::Cloudflare secrets are not configured; deploy skipped."
