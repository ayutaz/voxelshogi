name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      m5_live:
        description: Validate the fixed public Shogitter cohort on Linux
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  audit:
    name: Dependency audit
    uses: ./.github/workflows/dependency-audit.yml
    permissions:
      contents: read

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  lint:
    name: Lint (workflows, shell, web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: shellcheck@0.11.0
      - name: Install actionlint 1.7.12
        run: |
          curl -fsSL --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - run: actionlint -color
      - run: shellcheck scripts/*.sh scripts/ci/*.sh
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm lint
        working-directory: apps/web
      - run: node --test scripts/ci/*.test.mjs
      - run: node scripts/ci/mutation-controls.mjs

  msrv:
    name: Rust MSRV (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: rustup toolchain install 1.85.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: msrv
      - run: cargo +1.85.0 test --locked --workspace --all-targets

  gate:
    name: CI Gate
    # Keep fail/cancel detection; do not serialize workflows behind a queued gate.
    if: always()
    needs: [lint, rust, msrv, web, e2e-runtime, audit, dependency-review, python, models]
    outputs:
      models_publication: ${{ needs.web.outputs.models_publication }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: node scripts/ci/gate.mjs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}

  python:
    name: Python engine and model contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.23'
          enable-cache: true
      - run: uv sync --locked
      - name: Validate external CUDA lock without installing GPU packages
        run: uv lock --project infrastructure/cuda --check
      - run: uv run --locked ruff check export training crates/voxelshogi-python/python scripts/ci/mutation-*.py
      - run: uv run --locked ruff format --check export training crates/voxelshogi-python/python scripts/ci/mutation-*.py
      - run: uv run --locked pytest -q
      - name: Verify remote pilot on CI CPU without claiming GPU measurements
        run: uv run --locked python -m training.pilot runs/m4/ci-pilot --provider ci --allow-no-gpu --smoke --seconds 30
      - run: uv run --locked python scripts/ci/mutation-python.py
      - run: uv run --locked python scripts/ci/mutation-training.py
      - name: Validate private M5 sources and report only aggregate results
        if: github.event_name == 'workflow_dispatch' && inputs.m5_live
        timeout-minutes: 5
        run: uv run --locked python -m training.shogitter runs/m5/compatibility

  models:
    name: Browser model inference (real WASM)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.23'
          enable-cache: true
      - run: uv sync --locked
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm --dir apps/web install --frozen-lockfile
      - run: pnpm --dir apps/web wasm
      - run: uv run --locked python -m export.generate runs/m3/ci
      - name: Prepare local-only models without publishing binaries
        run: node scripts/prepare-inference.mjs runs/m3/ci apps/web/public/models/m3 --local
      - run: pnpm --dir apps/web build
      - run: pnpm --dir apps/web exec playwright install chromium
      - name: Verify all formats and real Worker interaction
        run: pnpm exec playwright test -c model-playwright.config.ts
        working-directory: apps/web
        env:
          PW_CHANNEL: ''
      # This private verification job does not publish model/trace artifacts.

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  web:
    name: Web (wasm, unit, build, e2e)
    # This image already includes Chrome's runtime libraries. Avoid apt's slow
    # font/library upgrades; the actual Chromium launch/E2E still validates them.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      models_publication: ${{ steps.model_policy.outputs.publication }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: wasm-bindgen-cli@${{ env.WASM_BINDGEN_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node ../../scripts/ci/check-versions.mjs
      - run: pnpm wasm
      - name: Verify fixed model inputs against Rust WASM
        run: node ../../scripts/model-fixtures.mjs --check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Compare native and real WASM search
        run: node ../../scripts/ci/search-parity.mjs
      - name: Read explicit model publication policy
        id: model_policy
        run: node scripts/model-publication.mjs export/publication.json
        working-directory: .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.model_policy.outputs.publication == 'true'
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: steps.model_policy.outputs.publication == 'true'
        with:
          version: '0.11.23'
          enable-cache: true
      - name: Generate approved model variants
        if: steps.model_policy.outputs.publication == 'true'
        working-directory: .
        run: |
          uv sync --locked
          uv run --locked python -m export.generate runs/m3/distribution --license Apache-2.0
          node scripts/model-publication.mjs export/publication.json runs/m3/distribution
          node scripts/prepare-inference.mjs runs/m3/distribution apps/web/public/models/m3
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - name: Verify approved distribution with real model E2E
        if: steps.model_policy.outputs.publication == 'true'
        run: pnpm exec playwright test -c model-playwright.config.ts
        env:
          PW_CHANNEL: ''
      - run: pnpm e2e
        env:
          PW_CHANNEL: ''
          E2E_COMMIT: ${{ github.sha }}
      - name: Repeat search and camera regression without retries
        run: pnpm e2e ai.spec.ts --grep '2D/3D and camera' --repeat-each=3 --workers=1 --retries=0
        env:
          PW_CHANNEL: ''
          E2E_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-e2e-wasm
          path: apps/web/src/wasm/pkg
          retention-days: 7
          if-no-files-found: error

  e2e-runtime:
    name: Public E2E runtime handoff
    needs: [web]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-e2e-wasm
          path: apps/web/src/wasm/pkg
          digest-mismatch: error
      # A fresh checkout has no generated WASM. Collecting the actual suite
      # exercises its Node imports using only the same-run artifact, on PRs too.
      - run: pnpm e2e --list
        working-directory: apps/web

  deploy:
    name: Deploy to Cloudflare
    needs: [gate]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://voxelshogi.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec playwright install chromium
        working-directory: apps/web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: apps/web/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-e2e-wasm
          path: apps/web/src/wasm/pkg
          digest-mismatch: error
      - name: Validate public E2E imports before publication
        run: pnpm e2e --list
        working-directory: apps/web
      - name: Check current main after acquiring production lock
        id: candidate
        run: node scripts/ci/deployment.mjs candidate
      - name: Validate production configuration
        id: config
        if: steps.candidate.outputs.current == 'true'
        run: node scripts/ci/deployment.mjs config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
      - name: Publish tested artifact
        id: publish
        if: steps.candidate.outputs.current == 'true'
        run: |
          pnpm --dir apps/web exec wrangler deploy --message "commit:$GITHUB_SHA" | tee "$RUNNER_TEMP/deploy.log"
          node scripts/ci/deployment.mjs record-version "$RUNNER_TEMP/deploy.log"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify published commit
        id: verify
        if: steps.candidate.outputs.current == 'true'
        run: node scripts/ci/deployment.mjs verify
      - name: Public E2E
        id: e2e
        if: steps.candidate.outputs.current == 'true'
        run: pnpm e2e
        working-directory: apps/web
        env:
          PW_CHANNEL: ''
          E2E_COMMIT: ${{ github.sha }}
      - name: Repeat public search and camera regression without retries
        if: steps.candidate.outputs.current == 'true'
        run: pnpm e2e ai.spec.ts --grep '2D/3D and camera' --repeat-each=3 --workers=1 --retries=0
        working-directory: apps/web
        env:
          PW_CHANNEL: ''
          E2E_COMMIT: ${{ github.sha }}
      - name: Audit exact public application, model and runtime files
        if: steps.candidate.outputs.current == 'true' && needs.gate.outputs.models_publication == 'true'
        run: node scripts/verify-model-distribution.mjs "$E2E_BASE_URL" model-distribution.json
        env:
          E2E_COMMIT: ${{ github.sha }}
      - name: Public model E2E on the exact approved distribution
        if: steps.candidate.outputs.current == 'true' && needs.gate.outputs.models_publication == 'true'
        run: pnpm exec playwright test -c model-playwright.config.ts
        working-directory: apps/web
        env:
          PW_CHANNEL: ''
          E2E_BASE_URL: https://voxelshogi.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: production-failure
          path: |
            apps/web/test-results
            deployment-info.json
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success() && steps.candidate.outputs.current == 'true'
        with:
          name: production-${{ github.sha }}
          path: |
            deployment-info.json
            model-distribution.json
          retention-days: 30
          if-no-files-found: error
      - name: Report deployment phases
        if: always()
        run: |
          {
            echo '### Production deployment'
            echo "- Commit: $GITHUB_SHA"
            echo "- Current main candidate: $CURRENT"
            echo "- Configuration: $CONFIG_RESULT"
            echo "- Publish: $PUBLISH_RESULT"
            echo "- Published commit verification: $VERIFY_RESULT"
            echo "- Public E2E: $E2E_RESULT"
            if [ "$CURRENT" = false ]; then
              echo '- Stale candidate was intentionally skipped; no publication occurred.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CURRENT: ${{ steps.candidate.outputs.current }}
          CONFIG_RESULT: ${{ steps.config.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          E2E_RESULT: ${{ steps.e2e.outcome }}
