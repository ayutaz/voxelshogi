[graph]
all-features = true

[advisories]
version = 2
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.93

[[licenses.exceptions]]
name = "target-lexicon"
version = "=0.13.5"
allow = ["Apache-2.0 WITH LLVM-exception"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
